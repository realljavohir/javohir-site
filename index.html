<style>
:root{--bg:#06050d;--panel:#100d1f;--panel2:#0b0917;--line:#2a2250;--violet:#8b5cf6;--cyan:#22d3ee;--pink:#f472b6;--text:#ece9ff;--muted:#a39cc9;--accent:#22d3ee}
[data-theme=light]{--bg:#f3f0ff;--panel:#fff;--panel2:#f8f6ff;--line:#d8cfff;--text:#1a1438;--muted:#5b5488;--accent:#0891b2}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--violet);top:-80px;left:-100px}
.o2{width:320px;height:320px;background:var(--cyan);bottom:-60px;right:-80px;animation-delay:-6s}
@keyframes float{to{transform:translate(60px,40px) scale(1.15)}}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:Unbounded,sans-serif;font-weight:700;line-height:1.15}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:10px}
nav b{font-family:Unbounded;font-size:15px;color:var(--accent);text-shadow:0 0 14px var(--accent)}
.links-nav{display:flex;gap:18px;font-size:14px;color:var(--muted)}
.links-nav a:hover{color:var(--text)}
.tools{display:flex;gap:8px}
.tools button,.tools select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer}
.tools button:hover,.tools select:hover{border-color:var(--violet)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:80vh;padding:30px 0 60px}
.hero h1{font-size:clamp(30px,5.2vw,56px);text-shadow:0 0 30px rgba(139,92,246,.5)}
.hero h1 span{color:var(--accent);text-shadow:0 0 24px var(--accent)}
.hero p{margin:20px 0 28px;color:var(--muted);max-width:46ch;font-size:17px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 24px;border-radius:12px;border:1px solid var(--violet);transition:.2s;cursor:pointer;font:inherit;font-weight:700;color:var(--text);background:transparent}
.btn.fill{background:linear-gradient(120deg,var(--violet),var(--pink));border-color:transparent;color:#fff;box-shadow:0 0 28px rgba(139,92,246,.5)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(34,211,238,.45)}
.stage{perspective:900px;height:340px;display:grid;place-items:center;animation:bob 6s ease-in-out infinite,pop 1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes bob{50%{translate:0 -12px}}
@keyframes pop{from{opacity:0;scale:.6}}
.av{position:relative;width:min(300px,70vw);aspect-ratio:1;transition:transform .15s;transform-style:preserve-3d}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--cyan),var(--violet),var(--pink),var(--cyan));animation:rot 6s linear infinite;box-shadow:0 0 60px rgba(139,92,246,.5)}
.av img{position:absolute;inset:9px;width:calc(100% - 18px);height:calc(100% - 18px);border-radius:50%;object-fit:cover;background:#000;display:block}
.orbit{position:absolute;inset:-24px;animation:rot 9s linear infinite}
.orbit b{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.orbit b:nth-child(1){left:calc(50% - 6px);top:0}
.orbit b:nth-child(2){right:14%;bottom:14%;background:var(--pink);box-shadow:0 0 14px var(--pink)}
.orbit b:nth-child(3){left:6%;bottom:30%;background:var(--violet);box-shadow:0 0 14px var(--violet)}
@keyframes rot{to{transform:rotate(360deg)}}
.role{margin:-8px 0 14px;font-family:Unbounded;font-size:clamp(14px,2vw,19px);color:var(--accent);min-height:1.6em}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero>div:first-child>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero>div:first-child>:nth-child(2){animation-delay:.15s}
.hero>div:first-child>:nth-child(3){animation-delay:.3s}
.hero>div:first-child>:nth-child(4){animation-delay:.45s}
@keyframes rise{from{opacity:0;transform:translateY(30px);filter:blur(8px)}}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:5;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 12px var(--violet)}
#glow{position:fixed;left:0;top:0;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 65%);pointer-events:none;z-index:0;transition:transform .12s linear}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(34,211,238,.18),transparent 55%)}
.card:hover::before{opacity:1}
section{padding:64px 0}
section h2{font-size:clamp(22px,3.4vw,34px);margin-bottom:30px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
.about{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:24px;transition:transform .15s,border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--violet);box-shadow:0 0 30px rgba(139,92,246,.28)}
.card h3{font-size:16px;margin-bottom:10px}
.card p{color:var(--muted);font-size:15px}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:15px}
dt{color:var(--muted)}dd b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tag{display:inline-block;margin-top:14px;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 12px}
.post img{width:100%;border-radius:12px;margin-bottom:12px;max-height:200px;object-fit:cover}
.post small{color:var(--muted);display:block;margin-bottom:6px}
.post p{white-space:pre-line}
form{display:grid;gap:14px;max-width:620px}
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input,select.f,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
input:focus,select.f:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 18px rgba(34,211,238,.3)}
textarea{min-height:110px;resize:vertical}
#msg{font-size:14px;color:var(--accent);min-height:20px}
.links{display:flex;gap:14px;flex-wrap:wrap}
.links a{padding:12px 20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:.2s}
.links a:hover{border-color:var(--pink);box-shadow:0 0 22px rgba(244,114,182,.4)}
footer{padding:40px 0;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
header{position:sticky;top:0;z-index:4;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent)}
section{scroll-margin-top:96px}
.wrap{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
input,select.f,textarea{font-size:16px}
.hero{min-height:80vh;min-height:80svh}
@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .hero{grid-template-columns:1fr;min-height:auto;padding-top:10px;padding-bottom:40px;text-align:center}
  .hero p{margin-left:auto;margin-right:auto}
  .btns{justify-content:center}
  .stage{height:270px;order:-1}
  .about{grid-template-columns:1fr}
  nav{flex-wrap:wrap}
  .links-nav{order:3;width:100%;overflow-x:auto;white-space:nowrap;gap:22px;padding-bottom:4px;scrollbar-width:none}
  .links-nav::-webkit-scrollbar{display:none}
  section{padding:48px 0}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .btn{width:100%;text-align:center}
  .stage{height:240px}
  .av{width:min(220px,62vw)}
  dl{grid-template-columns:1fr;gap:2px 0}
  dt{margin-top:8px}
  .links a{width:100%;text-align:center}
}
@media(prefers-reduced-motion:reduce){.stage,.ring,.orbit,.orb,.caret,.hero>div:first-child>*{animation:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>

var $=function(i){return document.getElementById(i)};
var tg=window.Telegram&&Telegram.WebApp,inTG=!!(tg&&tg.initData);
var lang='uz',theme='dark',posts=[];
function sg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function setLang(l){
  lang=L[l]?l:'uz';ss('lang',lang);$('lang').value=lang;
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=L[lang][e.dataset.t]});

  $('t').placeholder=L[lang].ph;
  $('postempty').textContent=L[lang].pe;
  renderPosts();
}
function setTheme(t){
  theme=t;ss('theme',t);document.documentElement.dataset.theme=t;
  $('theme').textContent=t==='dark'?'☾':'☀';
  if(inTG){try{var c=t==='dark'?'#06050d':'#f3f0ff';tg.setHeaderColor(c);tg.setBackgroundColor(c)}catch(e){}}
}
$('lang').onchange=function(){setLang(this.value)};
$('theme').onclick=function(){setTheme(theme==='dark'?'light':'dark')};

/* Mini App */

if(inTG){
  tg.ready();tg.expand();
  tl=tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code;
}

/* kanal postlari */
function renderPosts(){
  var box=$('postlist');box.textContent='';
  $('postempty').hidden=posts.length>0;
  posts.forEach(function(p){
    var c=document.createElement('a');c.className='card post';
    c.href='https://t.me/'+p.id;c.target='_blank';c.rel='noopener';
    if(p.photo){var im=document.createElement('img');im.src=p.photo;im.alt='';im.loading='lazy';c.appendChild(im)}

    d.textContent=p.date?new Date(p.date).toLocaleDateString(lang==='uz'?'uz-UZ':lang):'';
    var t=document.createElement('p');t.textContent=p.text;
    c.appendChild(d);c.appendChild(t);box.appendChild(c);
  });

  if(matchMedia('(hover:hover)').matches)document.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('pointermove',function(e){
      var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      c.style.transform='perspective(700px) rotateX('+(-y*7)+'deg) rotateY('+(x*7)+'deg)';c.style.setProperty('--mx',(x+.5)*100+'%');c.style.setProperty('--my',(y+.5)*100+'%');
    });
    c.addEventListener('pointerleave',function(){c.style.transform=''});
  });
}

/* zarrachalar va chiziqlar */
(function(){
  var cv=$('fx'),x=cv.getContext('2d'),W,H,P=[],M={x:-999,y:-999},C=['139,92,246','34,211,238','244,114,182'];
  function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  sz();addEventListener('resize',sz);
  addEventListener('pointermove',function(e){M.x=e.clientX;M.y=e.clientY});
  var N=innerWidth<700?36:70;
  for(var i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.8+.8,c:C[i%3]});
  function draw(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fillStyle='rgba('+p.c+',.85)';x.fill();
      for(var j=i+1;j<P.length;j++){
        var q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);
        if(d<110){x.strokeStyle='rgba('+p.c+','+(.22*(1-d/110))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}
      }
      var m=Math.hypot(p.x-M.x,p.y-M.y);
      if(m<150){x.strokeStyle='rgba(34,211,238,'+(.5*(1-m/150))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(M.x,M.y);x.stroke()}
    }
    if(!reduce)requestAnimationFrame(draw);
  }
  draw();
})();

/* yozuvchi rollar */
(function(){
  var i=0,j=0,del=false;
  function tick(){
    var w=L[lang].rl.split('|'),t=w[i%w.length];
    if(reduce){$('role').textContent=w[0];return}
    $('role').textContent=t.slice(0,j);
    var d=del?35:75;
    if(!del&&j===t.length){del=true;d=1400}
    else if(del&&j===0){del=false;i++;d=300}
    else j+=del?-1:1;
    setTimeout(tick,d);
  }
  tick();
})();
/* scroll chizig'i va kursor nuri */
addEventListener('scroll',function(){var h=document.documentElement;$('bar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%'},{passive:true});
if(!reduce&&matchMedia('(hover:hover)').matches){
  addEventListener('pointermove',function(e){$('glow').style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'});
}else $('glow').hidden=true;
</script>
